name: Build IN THE VOID APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '2.html'
      - 'app/**'
      - '*.html'
      - '*.js'
      - '*.png'
      - '*.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'google-services.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Android branding and icon
        run: node scripts/prepare-android.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version code
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IN_THE_VOID-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
